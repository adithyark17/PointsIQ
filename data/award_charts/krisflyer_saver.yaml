      ~30,500 miles one-way in SQ J — just ~15,250 [[Axis EDGE Miles]] at the 1:2
      ratio, or ~30,500 [[HDFC Reward Points]] at 1:1. Cash fare on this route
      regularly exceeds ₹60,000, putting realised value well above ₹2/point on Atlas.
