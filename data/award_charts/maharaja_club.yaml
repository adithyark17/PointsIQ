sweet_spots:
  - title: Everyone's terminal currency
    body: >-
      Every major Indian bank reaches Maharaja Points: [[Axis EDGE Miles]] at a
      market-best 1:2, [[ICICI Reward Points]] and [[HSBC Reward Points]] at 1:1,
      [[HDFC Reward Points]] and [[American Express Membership Rewards India]] at 2:1 —
      making Air India nonstops to [[JFK]]/[[YYZ]]/[[LHR]] the highest-floor redemption
      in the Indian ecosystem. Also bookable across [[Star Alliance]] partners.
