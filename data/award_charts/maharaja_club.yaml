sweet_spots:
  - title: The 1:1 workhorse
    body: >-
      Maharaja Points are the only terminal currency most Indian banks reach at 1:1
      ([[HDFC Reward Points]], [[Axis EDGE Miles]], [[American Express Membership Rewards India]],
      [[ICICI Reward Points]]) — making Air India nonstops to [[JFK]]/[[YYZ]]/[[LHR]]
      the highest-floor redemption in the Indian ecosystem. Also bookable across
      [[Star Alliance]] partners.
