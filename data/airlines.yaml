# Airlines — node type: airline
# `hubs` are IATA codes; the airport generator adds hub_for backlinks on those airport notes.
# `country` must match an OurAirports country name (validated by scripts/validate.py).
airlines:
  # ── Indian carriers ──────────────────────────────────────────────
  - name: Air India
    iata: AI
    country: India
    alliance: Star Alliance
    program: Air India Maharaja Club
    hubs: [DEL, BOM]
    status: active
  - name: Air India Express
    iata: IX
    country: India
    program: Air India Maharaja Club
    hubs: [DEL, CCJ, CNN]
    status: active
    notes: Low-cost arm of Air India; earns into Maharaja Club post-merger.
  - name: Vistara
    iata: UK
    country: India
    program: Club Vistara
    hubs: [DEL]
    status: merged
    notes: Merged into Air India (November 2024). Club Vistara balances moved to Maharaja Club.
  - name: IndiGo
    iata: 6E
    country: India
    program: IndiGo BluChips
    hubs: [DEL, BOM, BLR, HYD]
    status: active
  - name: Akasa Air
    iata: QP
    country: India
    hubs: [BOM, BLR]
    status: active
