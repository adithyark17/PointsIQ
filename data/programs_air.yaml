# Frequent flyer programs — node type: air-program
# pricing_model: zone | distance | dynamic | hybrid
# fuel_surcharges: none | low | moderate | high (typical YQ on own-metal awards)
programs:
  - name: Air India Maharaja Club
    airline: Air India
    alliance: Star Alliance
    currency_name: Maharaja Points
    pricing_model: hybrid
    expiry: 24 months of inactivity
    fuel_surcharges: low
    award_chart: Air India Maharaja Club Chart
    notes: >-
      The merged Air India + Vistara program. The only FFP most Indian bank currencies
      reach at 1:1, and the cheapest Star Alliance redemption channel from India.

  - name: Club Vistara
    airline: Vistara
    currency_name: CV Points
    pricing_model: zone
    status: merged
    notes: Merged into Air India Maharaja Club (2024-25); balances converted 1:1.

  - name: IndiGo BluChips
    airline: IndiGo
    currency_name: BluChips
    pricing_model: dynamic
    fuel_surcharges: none
    notes: Revenue-linked domestic program; no bank transfer partners yet.

  - name: Singapore Airlines KrisFlyer
    airline: Singapore Airlines
    alliance: Star Alliance
    currency_name: KrisFlyer miles
    pricing_model: zone
    expiry: 36 months fixed
    fuel_surcharges: low
    award_chart: KrisFlyer Saver Chart
    notes: >-
      The premium-cabin benchmark from India: Saver awards on SQ metal (suites/J) are
      near-impossible to book with anything except KrisFlyer miles. Reachable from
      almost every Indian transferable currency.

  - name: British Airways Executive Club
    airline: British Airways
    alliance: oneworld
    currency_name: Avios
    pricing_model: distance
    expiry: 36 months of inactivity
    fuel_surcharges: high
    award_chart: British Airways Avios Distance Chart
    notes: >-
      Distance-banded. Sweet from India for short hops (BOM-DXB, DEL-BKK) on partners.
      Avios pool freely between BA, Qatar, Iberia, Finnair and Aer Lingus accounts.

  - name: Qatar Airways Privilege Club
    airline: Qatar Airways
    alliance: oneworld
    currency_name: Avios
    pricing_model: zone
    expiry: 36 months of inactivity
    fuel_surcharges: moderate
    award_chart: Qatar Avios Chart
    notes: >-
      Uses Avios; best westbound J redemptions from India (Qsuites via DOH). Pool with
      British Airways Executive Club via Avios household transfers.

  - name: Cathay (Asia Miles)
    airline: Cathay Pacific
    alliance: oneworld
    currency_name: Asia Miles
    pricing_model: distance
    expiry: 18 months of inactivity (activity resets)
    fuel_surcharges: moderate
