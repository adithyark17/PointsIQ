        via: SmartBuy
        multiplier: 10
        note: hotel bookings via SmartBuy
    excluded_categories: [Fuel, Rent, Government & Tax]
    lounge_access: unlimited (Priority Pass primary + add-on)
    status: active
    verified: 2026-01

