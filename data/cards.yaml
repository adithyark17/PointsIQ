# Credit cards — node type: card
# earn rates and fees drift; verified dates mark last review of each entry.
cards:
  # ── HDFC ─────────────────────────────────────────────────────────
  - name: HDFC Infinia
    bank: HDFC Bank
    currency: HDFC Reward Points
    network: [Visa Infinite, Mastercard World]
    annual_fee_inr: 12500
    fee_waiver_spend_inr: 1000000
    earn_unit: 5 RP / ₹150
    reward_rate_pct: 3.3
    invite_only: true
    accelerated_earn:
      - category: Travel - Airlines
        via: SmartBuy
        multiplier: 5
        note: 10x points on select SmartBuy categories; 15,000 bonus RP/month cap
