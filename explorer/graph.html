<title>PointsIQ — Knowledge Graph Explorer</title>
<style>
:root{
  --surface:#f5f6f8; --panel:#ffffff; --ink:#1c2028; --ink-2:#5a6172; --ink-3:#9aa1b0;
  --line:#e3e6ec; --edge:rgba(28,32,40,.16); --edge-hi:rgba(28,32,40,.55);
  --accent:#4d7de0; --chip:#eceef2;
  --c-card:#c9423a; --c-currency:#c07f1c; --c-transfer:#a89422; --c-air-program:#3a66c4;
  --c-hotel-program:#8b5fc7; --c-airline:#2a9ab5; --c-alliance:#3d4150; --c-bank:#c74683;
  --c-mcc-category:#3f9a48; --c-portal:#a06a35; --c-award-chart:#8f3fc0; --c-concept:#8a8a60;
  --c-stopover-program:#c47430; --c-country:#2a9a8c; --c-region:#2a9a8c; --c-airport:#6a7180; --c-home:#1c2028;
}
:root[data-theme="dark"]{ --surface:#161920; --panel:#1d212b; --ink:#e8eaf0; --ink-2:#a9b0c0; --ink-3:#6b7284;
  --line:#2a2f3c; --edge:rgba(232,234,240,.13); --edge-hi:rgba(232,234,240,.6); --chip:#262b37;
  --c-card:#e0554d; --c-currency:#f2a33c; --c-transfer:#e8d44d; --c-air-program:#4d7de0;
  --c-hotel-program:#cfa6f2; --c-airline:#4dc4e0; --c-alliance:#eceef2; --c-bank:#e05d9a;
  --c-mcc-category:#5dbf62; --c-portal:#cc8a4d; --c-award-chart:#a24fd0; --c-concept:#b6b678;
  --c-stopover-program:#e0954d; --c-country:#3cb8a8; --c-region:#3cb8a8; --c-airport:#9299a8; --c-home:#ffffff; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --surface:#161920; --panel:#1d212b; --ink:#e8eaf0; --ink-2:#a9b0c0; --ink-3:#6b7284;
  --line:#2a2f3c; --edge:rgba(232,234,240,.13); --edge-hi:rgba(232,234,240,.6); --chip:#262b37;
  --c-card:#e0554d; --c-currency:#f2a33c; --c-transfer:#e8d44d; --c-air-program:#4d7de0;
  --c-hotel-program:#cfa6f2; --c-airline:#4dc4e0; --c-alliance:#eceef2; --c-bank:#e05d9a;
  --c-mcc-category:#5dbf62; --c-portal:#cc8a4d; --c-award-chart:#a24fd0; --c-concept:#b6b678;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;cursor:grab}
canvas.drag{cursor:grabbing}
header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;
  padding:10px 16px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.01em}
h1 small{color:var(--ink-3);font-weight:450;margin-left:8px;font-size:12px}
.census{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;
  font-size:12px;color:var(--ink-2);display:flex;gap:14px}
.census b{color:var(--ink);font-weight:600}
#searchwrap{position:relative;margin-left:auto}
#search{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:6px 12px;font:inherit;font-size:13px;width:240px;outline:none}
#search:focus{border-color:var(--accent)}
#results{position:absolute;top:110%;right:0;width:300px;max-height:280px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;z-index:9}
#results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;
  border:0;padding:8px 12px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#results button:hover,#results button.sel{background:var(--chip)}
#results .t{color:var(--ink-3);font-size:11px;margin-left:auto;white-space:nowrap}
#legend{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(640px,70vw);z-index:5}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
  color:var(--ink-2);font-size:12px;cursor:pointer;user-select:none}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .n{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-3)}
.chip.off{opacity:.38}
#panel{position:absolute;top:64px;right:12px;bottom:12px;width:320px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:16px;overflow:auto;z-index:6;
  box-shadow:0 12px 40px rgba(0,0,0,.22);display:none}
#panel.open{display:block}
#panel .close{position:absolute;top:10px;right:10px;background:var(--chip);border:0;color:var(--ink-2);
  width:26px;height:26px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1}
#panel h2{font-size:16px;margin:2px 0 4px;padding-right:28px;text-wrap:balance}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.badge .dot{width:8px;height:8px;border-radius:50%}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 14px;font-size:12.5px}
dt{color:var(--ink-3)} dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#panel h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
.nb{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--ink);
  font:inherit;font-size:13px;padding:4px 6px;border-radius:7px;cursor:pointer;text-align:left}
.nb:hover{background:var(--chip)}
.nb .dot{width:8px;height:8px;border-radius:50%;flex:none}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:12.5px;z-index:8;display:none;
  box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:260px}
#tip .t{color:var(--ink-3);font-size:11px}
#hint{position:absolute;right:16px;bottom:14px;color:var(--ink-3);font-size:11.5px;z-index:4;text-align:right}
@media (max-width:720px){ #panel{width:min(320px,88vw)} #search{width:150px} }
</style>
<div id="app">
  <canvas id="cv" aria-label="PointsIQ knowledge graph. Use the search box to find nodes."></canvas>
  <header>
    <h1>PointsIQ Knowledge Graph<small>curated core, live</small></h1>
    <div class="census"><span>vault <b>6,918</b> nodes · <b>13,969</b> edges</span>
      <span>shown <b id=cN></b> nodes · <b id=cE></b> edges</span></div>
    <div id="searchwrap">
      <input id="search" type="search" placeholder="Search — try Infinia, KrisFlyer, DEL…" autocomplete="off">
      <div id="results" role="listbox"></div>
    </div>
  </header>
  <div id="legend" role="group" aria-label="Toggle node types"></div>
  <aside id="panel" aria-live="polite"><button class="close" aria-label="Close">✕</button><div id="pbody"></div></aside>
  <div id="tip"></div>
  <div id="hint">drag to pan · wheel to zoom · click a node to walk the graph</div>
</div>

function readColors(){ COL={}; for(const t of TYPES) COL[t]=css().getPropertyValue('--c-'+t).trim() || '#888';
  COL._edge=css().getPropertyValue('--edge').trim(); COL._edgeHi=css().getPropertyValue('--edge-hi').trim();
  COL._ink=css().getPropertyValue('--ink').trim(); COL._ink3=css().getPropertyValue('--ink-3').trim();
  COL._surface=css().getPropertyValue('--surface').trim(); }
readColors();
new MutationObserver(()=>{readColors();draw()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();draw()});

// adjacency + degree
const adj = N.map(()=>[]);
for(const [a,b] of E){ adj[a].push(b); adj[b].push(a); }
const deg = adj.map(a=>a.length);

// seed positions clustered by type around a circle
const rng = (s=>()=> (s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff)(42);
const tAngle = {}; TYPES.forEach((t,i)=>tAngle[t]= i/TYPES.length*2*Math.PI);
const P = N.map((n,i)=>{ const a=tAngle[n.t]+ (rng()-.5)*.9, r= 260+rng()*160;
  return {x:Math.cos(a)*r, y:Math.sin(a)*r, vx:0, vy:0}; });

const hidden = new Set();
const visN = i => !hidden.has(N[i].t);

// force simulation
let alpha = 1, running = true;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){
  const k2 = 1500;
  for(let i=0;i<N.length;i++){ if(!visN(i)) continue; const pi=P[i];
    for(let j=i+1;j<N.length;j++){ if(!visN(j)) continue; const pj=P[j];
      let dx=pi.x-pj.x, dy=pi.y-pj.y, d2=dx*dx+dy*dy;
      if(d2>90000||d2===0) continue; const f=k2/d2;
      dx*=f; dy*=f; pi.vx+=dx; pi.vy+=dy; pj.vx-=dx; pj.vy-=dy; } }
  for(const [a,b] of E){ if(!visN(a)||!visN(b)) continue;
    const pa=P[a], pb=P[b]; let dx=pb.x-pa.x, dy=pb.y-pa.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-70)*0.015/d;
    dx*=f; dy*=f; pa.vx+=dx; pa.vy+=dy; pb.vx-=dx; pb.vy-=dy; }
  for(let i=0;i<N.length;i++){ const p=P[i];
    p.vx-=p.x*0.004; p.vy-=p.y*0.004;
    p.vx*=0.82; p.vy*=0.82;
    if(i!==dragI){ p.x+=p.vx*alpha; p.y+=p.vy*alpha; } }
  alpha=Math.max(alpha*0.995,0.12);
}
if(reduced){ for(let i=0;i<600;i++) tick(); running=false; }

// canvas + camera
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,dpr; function resize(){ dpr=devicePixelRatio||1; W=innerWidth; H=innerHeight;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px'; draw(); }
addEventListener('resize',resize);
const cam={x:0,y:0,z:0.85};
const s2w=(sx,sy)=>({x:(sx-W/2)/cam.z+cam.x, y:(sy-H/2)/cam.z+cam.y});
let selI=-1, hovI=-1, dragI=-1;

function radius(i){ return Math.min(4+Math.sqrt(deg[i])*1.6, 16); }
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  ctx.translate(W/2,H/2); ctx.scale(cam.z,cam.z); ctx.translate(-cam.x,-cam.y);
  const nbSel = selI>=0 ? new Set(adj[selI]) : null;
  // edges
  ctx.lineWidth=1/cam.z;
  for(const [a,b] of E){ if(!visN(a)||!visN(b)) continue;
    const hi = selI>=0 && (a===selI||b===selI);
    ctx.strokeStyle= hi? COL._edgeHi : COL._edge;
    ctx.beginPath(); ctx.moveTo(P[a].x,P[a].y); ctx.lineTo(P[b].x,P[b].y); ctx.stroke(); }
  // nodes
  for(let i=0;i<N.length;i++){ if(!visN(i)) continue; const p=P[i], r=radius(i);
    const dimmed = selI>=0 && i!==selI && !nbSel.has(i);
    ctx.globalAlpha = dimmed? .25 : 1;
    ctx.fillStyle=COL[N[i].t];
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
    if(i===selI||i===hovI){ ctx.strokeStyle=COL._ink; ctx.lineWidth=2/cam.z; ctx.stroke(); }
    ctx.globalAlpha=1; }
  // labels: selected + neighbors + hovered + hubs at zoom
  ctx.font=`${11/cam.z}px system-ui,sans-serif`; ctx.textBaseline='middle';
  for(let i=0;i<N.length;i++){ if(!visN(i)) continue;
    const show = i===selI || i===hovI || (nbSel&&nbSel.has(i)) || (cam.z>1.15) || (deg[i]>=14 && cam.z>0.7);
    if(!show) continue; const p=P[i], r=radius(i);
    ctx.fillStyle = (i===selI||i===hovI)? COL._ink : COL._ink3;
    ctx.fillText(N[i].id, p.x+r+4/cam.z, p.y); }
}
function loop(){ if(running&&!reduced) tick(); draw(); requestAnimationFrame(loop); }

// interaction
let panning=false,lx=0,ly=0;
function pick(sx,sy){ const w=s2w(sx,sy); let best=-1,bd=1e9;
  for(let i=0;i<N.length;i++){ if(!visN(i)) continue;
    const dx=P[i].x-w.x, dy=P[i].y-w.y, d=Math.hypot(dx,dy);
    const hit=Math.max(radius(i)+6/cam.z, 12/cam.z);
    if(d<hit&&d<bd){bd=d;best=i;} } return best; }
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId);
  const i=pick(e.clientX,e.clientY);
  if(i>=0){ dragI=i; alpha=Math.max(alpha,.4); } else { panning=true; cv.classList.add('drag'); }
  lx=e.clientX; ly=e.clientY; });
cv.addEventListener('pointermove',e=>{
  if(dragI>=0){ const w=s2w(e.clientX,e.clientY); P[dragI].x=w.x; P[dragI].y=w.y; alpha=Math.max(alpha,.3); draw(); }
  else if(panning){ cam.x-=(e.clientX-lx)/cam.z; cam.y-=(e.clientY-ly)/cam.z; lx=e.clientX; ly=e.clientY; draw(); }
  else { const i=pick(e.clientX,e.clientY); hovI=i;
    const tip=document.getElementById('tip');
    if(i>=0){ tip.style.display='block';
      tip.style.left=Math.min(e.clientX+14,W-270)+'px'; tip.style.top=(e.clientY+12)+'px';
      tip.innerHTML=`<b>${esc(N[i].id)}</b><div class=t>${LABELS[N[i].t]||N[i].t} · ${deg[i]} links</div>`;
      cv.style.cursor='pointer'; }
    else { tip.style.display='none'; cv.style.cursor='grab'; }
    draw(); } });
cv.addEventListener('pointerup',e=>{
  if(dragI>=0 && Math.hypot(e.clientX-lx,e.clientY-ly)<4) select(dragI);
  else if(panning && Math.hypot(e.clientX-lx,e.clientY-ly)<4){ const i=pick(e.clientX,e.clientY); if(i<0) select(-1); }
  dragI=-1; panning=false; cv.classList.remove('drag'); });
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0012), before=s2w(e.clientX,e.clientY);
  cam.z=Math.min(Math.max(cam.z*f,0.15),5);
  const after=s2w(e.clientX,e.clientY);
  cam.x+=before.x-after.x; cam.y+=before.y-after.y; draw(); },{passive:false});

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// selection + panel
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody');
panel.querySelector('.close').onclick=()=>select(-1);
function select(i){ selI=i;
  if(i<0){ panel.classList.remove('open'); draw(); return; }
  const n=N[i];
  let h=`<h2>${esc(n.id)}</h2><div class=badge><span class=dot style="background:${COL[n.t]}"></span>${LABELS[n.t]||n.t} · ${deg[i]} links</div>`;
  const keys=Object.keys(n.d||{});
  if(keys.length){ h+='<dl>'+keys.map(k=>`<dt>${esc(k.replaceAll('_',' '))}</dt><dd>${esc(n.d[k])}</dd>`).join('')+'</dl>'; }
  const nbs=[...new Set(adj[i])].sort((a,b)=>deg[b]-deg[a]);
  if(nbs.length){ h+=`<h3>Connected (${nbs.length})</h3>`+nbs.map(j=>
    `<button class=nb data-i=${j}><span class=dot style="background:${COL[N[j].t]}"></span>${esc(N[j].id)}</button>`).join(''); }
  pbody.innerHTML=h; panel.classList.add('open');
  pbody.querySelectorAll('.nb').forEach(b=>b.onclick=()=>{ const j=+b.dataset.i; focus(j); });
  draw(); }
function focus(i){ if(hidden.has(N[i].t)) toggleType(N[i].t,true);
  select(i); const p=P[i];
  cam.x=p.x; cam.y=p.y; cam.z=Math.max(cam.z,1.3); draw(); }

// legend
const leg=document.getElementById('legend');
const counts={}; N.forEach(n=>counts[n.t]=(counts[n.t]||0)+1);
const chips={};
for(const t of TYPES){ if(t==='home') continue;
  const b=document.createElement('button'); b.className='chip'; chips[t]=b;
  b.innerHTML=`<span class=dot style="background:${COL[t]}"></span>${LABELS[t]||t} <span class=n>${counts[t]}</span>`;
  b.setAttribute('aria-pressed','true');
  b.onclick=()=>toggleType(t); leg.appendChild(b); }
function toggleType(t,forceOn){ 
  if(forceOn||hidden.has(t)){ hidden.delete(t); chips[t].classList.remove('off'); chips[t].setAttribute('aria-pressed','true'); }
  else { hidden.add(t); chips[t].classList.add('off'); chips[t].setAttribute('aria-pressed','false');
    if(selI>=0&&N[selI].t===t) select(-1); }
  updateCensus(); alpha=Math.max(alpha,.4); draw(); }
function updateCensus(){
  document.getElementById('cN').textContent=N.filter((n,i)=>visN(i)).length.toLocaleString();
  document.getElementById('cE').textContent=E.filter(([a,b])=>visN(a)&&visN(b)).length.toLocaleString(); }

// search
const inp=document.getElementById('search'), res=document.getElementById('results');
let selIdx=-1, matches=[];
function renderResults(){ if(!matches.length){res.style.display='none';return;}
  res.innerHTML=matches.slice(0,12).map((i,k)=>
    `<button class="${k===selIdx?'sel':''}" data-i=${i}><span class=dot style="width:8px;height:8px;border-radius:50%;background:${COL[N[i].t]}"></span>${esc(N[i].id)}<span class=t>${LABELS[N[i].t]||N[i].t}</span></button>`).join('');
  res.style.display='block';
  res.querySelectorAll('button').forEach(b=>b.onclick=()=>{ focus(+b.dataset.i); res.style.display='none'; inp.value=N[+b.dataset.i].id; }); }
inp.addEventListener('input',()=>{ const q=inp.value.trim().toLowerCase(); selIdx=-1;
  if(!q){matches=[];renderResults();return;}
  matches=N.map((n,i)=>i).filter(i=>N[i].id.toLowerCase().includes(q))
    .sort((a,b)=> (N[a].id.toLowerCase().indexOf(q)-N[b].id.toLowerCase().indexOf(q)) || deg[b]-deg[a]);
  renderResults(); });
inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){selIdx=Math.min(selIdx+1,Math.min(matches.length,12)-1);renderResults();e.preventDefault();}
  else if(e.key==='ArrowUp'){selIdx=Math.max(selIdx-1,0);renderResults();e.preventDefault();}
  else if(e.key==='Enter'&&matches.length){ const i=matches[Math.max(selIdx,0)]; focus(i); res.style.display='none'; inp.value=N[i].id; }
  else if(e.key==='Escape'){ res.style.display='none'; } });
document.addEventListener('click',e=>{ if(!e.target.closest('#searchwrap')) res.style.display='none'; });

updateCensus(); resize(); loop();
</script>
